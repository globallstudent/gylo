[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/globallstudent/gylo"

[workspace.dependencies]
gylo-core = { version = "0.1.0", path = "crates/gylo-core" }
gylo-pg = { version = "0.1.0", path = "crates/gylo-pg" }
gylo-worker = { version = "0.1.0", path = "crates/gylo-worker" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
thiserror = "2.0"
# the union every crate needs, instead of "full": compile time and binary size
# are paid by whoever builds from source, on every build
tokio = { version = "1.53", features = [
  "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time",
] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.24", features = ["v4"] }
