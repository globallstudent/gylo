[package]
name = "gylo-chaos"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
gylo-pg = { version = "0.1.0", path = "../crates/gylo-pg" }
gylo-worker = { version = "0.1.0", path = "../crates/gylo-worker" }
rmp-serde = "1.3.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
