name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gylo
          POSTGRES_PASSWORD: gylo
          POSTGRES_DB: gylo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gylo:gylo@127.0.0.1:5432/gylo_test
      # deliberately its own variable: the Python fixtures truncate, and
      # pointing them at DATABASE_URL would wipe a developer's dev database
      GYLO_TEST_DATABASE_URL: postgres://gylo:gylo@127.0.0.1:5432/gylo_test
      GYLO_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - run: python3 .github/check-versions.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      # the floor gylo claims to support, so the suite proves the claim rather
      # than only the syntax check inside it
      - run: uv venv --python 3.11

      # one source of truth: the dev group in pyproject.toml. A parallel list
      # here is how the sync-driver tests once arrived without their drivers
      - run: uv sync --no-install-project --group dev

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - run: .venv/bin/ruff format --check python benches crates/gylo-worker/tests/fixtures

      - run: .venv/bin/ruff check python benches crates/gylo-worker/tests/fixtures

      # cargo test provisions its own databases; the Python suite works
      # against this one and needs the schema put there first
      - run: cargo run -p gylo-cli -- migrate

      - run: PYTHONPATH=python .venv/bin/python -m pytest python -q

  # every interpreter the classifiers claim, not only the floor. The full Rust
  # suite stays on the floor job; what varies by interpreter is the Python
  # package, so that is what this matrix runs.
  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gylo
          POSTGRES_PASSWORD: gylo
          POSTGRES_DB: gylo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GYLO_TEST_DATABASE_URL: postgres://gylo:gylo@127.0.0.1:5432/gylo_test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      - run: uv venv --python ${{ matrix.python }}

      - run: uv sync --no-install-project --group dev

      - run: DATABASE_URL=$GYLO_TEST_DATABASE_URL cargo run -p gylo-cli -- migrate

      - run: PYTHONPATH=python .venv/bin/python -m pytest python -q
