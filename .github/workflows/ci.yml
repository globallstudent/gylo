name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gylo
          POSTGRES_PASSWORD: gylo
          POSTGRES_DB: gylo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gylo:gylo@127.0.0.1:5432/gylo_test
      GYLO_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      # the floor gylo claims to support, so the suite proves the claim rather
      # than only the syntax check inside it
      - run: uv venv --python 3.11

      - run: uv pip install msgspec pytest pytest-asyncio asyncpg ruff

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - run: .venv/bin/ruff format --check python benches crates/gylo-worker/tests/fixtures

      - run: .venv/bin/ruff check python benches crates/gylo-worker/tests/fixtures

      - run: PYTHONPATH=python .venv/bin/python -m pytest python -q
