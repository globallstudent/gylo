name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One wheel per platform rather than per platform and interpreter: the wheel
  # carries a binary and pure Python, with no extension module, so it is tagged
  # py3-none-<platform> and serves every supported version at once.
  wheels:
    name: wheel (${{ matrix.platform.runner }} ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # No Windows: the supervisor talks to its children over a Unix
        # domain socket, which tokio does not offer there, so gylo does not
        # compile for it at all. That needs a named-pipe transport, not a
        # build flag. Both macOS targets build on the arm64 runner, since the
        # x86_64 runners are being retired and queue indefinitely.
        platform:
          - { runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          # 2_28 rather than auto: the manylinux2014 aarch64 cross-compiler
          # is old enough not to define __ARM_ARCH, which ring's assembly
          # requires. Dropping TLS would avoid ring and also every managed
          # Postgres, so the newer container is the cheaper concession.
          - { runner: ubuntu-22.04, target: aarch64, manylinux: "2_28" }
          # full triples: given the short name the musl containers resolve the
          # gnu target and ring's C build fails against the wrong libc
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: macos-14, target: aarch64, manylinux: auto }
          - { runner: macos-14, target: x86_64, manylinux: auto }

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Runs the built wheel on the hardware it claims, because a wheel that only
  # ever cross-compiled has proven nothing about executing. The arm runner is
  # real aarch64, which the Linux arm wheel had never touched before this job.
  smoke:
    needs: [wheels]
    strategy:
      fail-fast: false
      matrix:
        probe:
          - { runner: ubuntu-24.04, artifact: wheels-ubuntu-22.04-x86_64-auto }
          - { runner: ubuntu-24.04-arm, artifact: wheels-ubuntu-22.04-aarch64-2_28 }
          - { runner: macos-14, artifact: wheels-macos-14-aarch64-auto }
    runs-on: ${{ matrix.probe.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.probe.artifact }}
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m venv smoke && smoke/bin/pip install --quiet dist/*.whl

      - run: smoke/bin/gylo --version

      - run: smoke/bin/python -c "import gylo; print('import ok,', gylo.__version__)"

  publish:
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    # only a tag publishes, so a manual run is a safe way to prove the wheels
    # build without spending a version number that can never be reused
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      # what Trusted Publishing exchanges for a short-lived token, so no API
      # token is ever stored in this repository
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
