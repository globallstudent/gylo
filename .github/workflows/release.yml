name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One wheel per platform rather than per platform and interpreter: the wheel
  # carries a binary and pure Python, with no extension module, so it is tagged
  # py3-none-<platform> and serves every supported version at once.
  wheels:
    name: wheel (${{ matrix.platform.runner }} ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # No Windows: the supervisor talks to its children over a Unix
        # domain socket, which tokio does not offer there, so gylo does not
        # compile for it at all. That needs a named-pipe transport, not a
        # build flag. Both macOS targets build on the arm64 runner, since the
        # x86_64 runners are being retired and queue indefinitely.
        platform:
          - { runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-22.04, target: aarch64, manylinux: auto }
          - { runner: ubuntu-22.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-14, target: aarch64, manylinux: auto }
          - { runner: macos-14, target: x86_64, manylinux: auto }

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # only a tag publishes, so a manual run is a safe way to prove the wheels
    # build without spending a version number that can never be reused
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      # what Trusted Publishing exchanges for a short-lived token, so no API
      # token is ever stored in this repository
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
