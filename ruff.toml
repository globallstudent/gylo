target-version = "py314"
line-length = 88

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM", "PTH", "RUF"]

[lint.per-file-ignores]
"crates/gylo-worker/tests/fixtures/*" = ["ANN", "INP"]
"crates/gylo-chaos/*" = ["INP"]
"python/tests/*" = ["N818"]

[lint.isort]
known-first-party = ["gylo"]
