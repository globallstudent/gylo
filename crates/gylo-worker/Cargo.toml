[package]
name = "gylo-worker"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gylo-core = { version = "0.1.0", path = "../gylo-core" }
gylo-pg = { version = "0.1.0", path = "../gylo-pg" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = "1.24.0"

[dev-dependencies]
rmp-serde = "1.3.1"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
