[package]
name = "gylo-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Wire protocol and shared types for gylo"
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.19"

[dev-dependencies]
proptest = "1.11.0"
