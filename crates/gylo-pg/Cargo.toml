[package]
name = "gylo-pg"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gylo-core = { version = "0.1.0", path = "../gylo-core" }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid", "migrate", "macros", "json", "chrono"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.151"
