[package]
name = "gylo-redis"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
gylo-core = { version = "0.1.0", path = "../gylo-core" }
redis = { version = "1.5.0", features = ["tokio-comp", "script"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
